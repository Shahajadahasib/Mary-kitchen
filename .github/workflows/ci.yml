name: CI/CD

# Everything lives in one workflow on purpose: the deploy job gates on the
# test jobs via `needs:`, so a red check makes the deploy physically
# unreachable. Two separate workflows could not express that ordering — the
# old deploy.yml triggered on the same push as CI and raced it.
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

# Never let two deploys touch the VPS at once. Queue them instead of
# cancelling, so an in-flight deploy is always allowed to finish or roll back
# cleanly rather than being killed halfway through a migration.
concurrency:
    group: cicd-${{ github.ref }}
    cancel-in-progress: false

jobs:
    backend:
        name: Backend (Django)
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: mary_kitchen_test
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        defaults:
            run:
                working-directory: backend

        env:
            DJANGO_SETTINGS_MODULE: mary_kitchen.settings.development
            SECRET_KEY: ci-secret-key-not-for-production
            DEBUG: "True"
            ALLOWED_HOSTS: localhost,127.0.0.1
            DB_ENGINE: django.db.backends.postgresql
            DB_NAME: mary_kitchen_test
            DB_USER: postgres
            DB_PASSWORD: postgres
            DB_HOST: localhost
            DB_PORT: "5432"
            REDIS_URL: redis://localhost:6379/0
            CELERY_BROKER_URL: redis://localhost:6379/1
            CELERY_RESULT_BACKEND: redis://localhost:6379/2
            EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
            STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
            STRIPE_SECRET_KEY: sk_test_placeholder
            STRIPE_WEBHOOK_SECRET: whsec_placeholder
            FRONTEND_URL: http://localhost:3000
            STORE_LATITUDE: "-12.4634"
            STORE_LONGITUDE: "130.8456"

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: backend/requirements.txt

            - run: pip install -r requirements.txt

            - name: Check no missing migrations
              run: python manage.py makemigrations --check --dry-run

            - name: Check production settings load
              # CI otherwise only ever exercises settings.development, so a
              # production-only misconfiguration would first surface on the VPS.
              env:
                  DJANGO_SETTINGS_MODULE: mary_kitchen.settings.production
                  DEBUG: "False"
                  ALLOWED_HOSTS: example.com
                  CORS_ALLOWED_ORIGINS: https://example.com
              run: python manage.py check --deploy --fail-level ERROR

            - run: python manage.py migrate

            - name: Run tests
              run: python manage.py test --verbosity 2

    frontend:
        name: Frontend (Next.js)
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: frontend

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - run: npm ci

            - run: npm run lint

            - name: Typecheck
              run: npx tsc --noEmit

            - name: Build
              env:
                  NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
                  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
              run: npm run build

    docker:
        name: Docker images build
        runs-on: ubuntu-latest
        # The VPS deploys from these Dockerfiles, but the jobs above build
        # natively — without this job a broken Dockerfile passes CI and only
        # fails once it is already taking production down.
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: Build backend image
              uses: docker/build-push-action@v6
              with:
                  context: ./backend
                  push: false
                  load: false
                  cache-from: type=gha,scope=backend
                  cache-to: type=gha,scope=backend,mode=max

            - name: Build frontend image
              uses: docker/build-push-action@v6
              with:
                  context: ./frontend
                  push: false
                  load: false
                  build-args: |
                      NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
                  cache-from: type=gha,scope=frontend
                  cache-to: type=gha,scope=frontend,mode=max

    deploy:
        name: Deploy to VPS
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: [backend, frontend, docker]
        # Belt and braces: `needs` guarantees the checks passed, and this `if`
        # guarantees only a real push to main can deploy — never a pull request
        # build, and never a manual dispatch from a side branch.
        if: >-
            github.event_name == 'push' &&
            github.ref == 'refs/heads/main'

        steps:
            - name: Deploy
              uses: appleboy/ssh-action@v1.0.3
              env:
                  DEPLOY_SHA: ${{ github.sha }}
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  port: 22
                  timeout: 120s
                  command_timeout: 25m
                  envs: DEPLOY_SHA
                  script_stop: true
                  script: |
                      set -euo pipefail
                      cd /var/www/Mary-kitchen
                      bash deploy/deploy.sh "$DEPLOY_SHA"
